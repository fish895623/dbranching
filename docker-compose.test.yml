version: '3.8'

services:
  mysql-test:
    image: mysql:8.0
    container_name: dbranching-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: testpass
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    volumes:
      - mysql_test_data:/var/lib/mysql

  postgres-test:
    image: postgres:15
    container_name: dbranching-postgres-test
    environment:
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

volumes:
  mysql_test_data:
  postgres_test_data: