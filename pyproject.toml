[tool.poetry]
name = "dbranching"
version = "0.1.0"
description = "Database branching and snapshot management tool"
authors = ["fish895623 <dan990429@gmail.com>"]
readme = "README.md"
packages = [{include = "dbranching", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
click = "^8.1.7"
pyyaml = "^6.0.1"
pydantic = "^2.5.0"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
aiomysql = "^0.2.0"
PyMySQL = "^1.1.0"
aiosqlite = "^0.19.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.1"
pytest-benchmark = "^4.0.0"
pytest-xdist = "^3.5.0"
pytest-mock = "^3.12.0"
mypy = "^1.7.1"
black = "^23.11.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
psutil = "^5.9.0"

[tool.poetry.scripts]
dbranching = "dbranching.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --cov=dbranching --cov-report=term-missing --cov-report=html --cov-report=xml"
testpaths = ["tests"]
markers = [
    "asyncio: marks tests as asyncio tests",
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (slower, real dependencies)",
    "performance: marks tests as performance benchmarks",
    "mysql: marks tests requiring MySQL database",
    "postgresql: marks tests requiring PostgreSQL database", 
    "sqlite: marks tests requiring SQLite database",
    "slow: marks tests as slow running"
]

[tool.coverage.run]
source = ["src/dbranching"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]

[tool.coverage.html]
directory = "htmlcov"

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "E501", "W503"]
exclude = [".git", "__pycache__", "dist", "build", ".venv"]