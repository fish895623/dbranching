version: '1.0'
databases:
  default:
    driver: postgresql
    host: localhost
    port: 5432
    database: myapp_development
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    ssl_mode: prefer
    pool_size: 10
    connect_timeout: 30s
    query_timeout: 60s
  test:
    driver: sqlite
    database: test.db
storage:
  path: ${HOME}/.dbranching/snapshots
  compression:
    algorithm: gzip
    level: 6
  retention:
    max_age: 30d
    max_count: 100
  patterns:
  - branches:
    - main
    - master
    max_age: 90d
    max_count: 50
  - branches:
    - feature/*
    max_age: 7d
    max_count: 10
  max_size: 10GB
  monitoring_threshold: 0.8
git:
  hooks:
    enabled: true
    auto_install: true
  branches:
    auto_snapshot:
    - main
    - develop
    ignore:
    - temp/*
    - wip/*
cli:
  output_format: table
  color: auto
  progress_bars: true
  confirm_destructive: true
  pager: true
logging:
  level: INFO
  format: structured
  file: ${HOME}/.dbranching/logs/dbranching.log
  rotate_size: 10MB
  rotate_count: 5
  console: true
features:
  experimental_features: false
  parallel_operations: true
  hot_reload: true
  performance_monitoring: false
security:
  encrypt_snapshots: false
  encryption_key_env: DBRANCHING_ENCRYPTION_KEY
  config_file_permissions: '600'
  audit_logging: true
