[tool.poetry]
name = "dbranching"
version = "0.1.0"
description = "Database branching and snapshot management tool for development workflows"
authors = ["fish895623 <dan990429@gmail.com>"]
readme = "README.md"
homepage = "https://github.com/fish895623/dbranching"
repository = "https://github.com/fish895623/dbranching"
documentation = "https://github.com/fish895623/dbranching#readme"
keywords = ["database", "branching", "snapshot", "development", "testing", "postgresql", "mysql", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9", 
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Version Control",
    "Typing :: Typed",
]
packages = [{include = "dbranching", from = "src"}]
include = [
    "CHANGELOG.md",
    "LICENSE",
    "src/dbranching/py.typed",
]

[tool.poetry.dependencies]
python = "^3.8.1"
click = "^8.1.0"
pyyaml = "^6.0"
pydantic = "^2.0.0"

# Optional database driver dependencies
asyncpg = {version = "^0.29.0", optional = true}
psycopg2-binary = {version = "^2.9.0", optional = true}
aiomysql = {version = "^0.2.0", optional = true}
PyMySQL = {version = "^1.1.0", optional = true}
aiosqlite = {version = "^0.19.0", optional = true}

[tool.poetry.extras]
postgresql = ["asyncpg", "psycopg2-binary"]
mysql = ["aiomysql", "PyMySQL"]
sqlite = ["aiosqlite"]
all-databases = ["asyncpg", "psycopg2-binary", "aiomysql", "PyMySQL", "aiosqlite"]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.0"
pytest-benchmark = "^4.0.0"
pytest-xdist = "^3.3.0"
pytest-mock = "^3.11.0"
mypy = "^1.5.0"
black = "^23.7.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
psutil = "^5.9.0"

# Security and quality tools
bandit = "^1.7.0"
safety = "^2.3.0"
semgrep = "^1.45.0"

# Build and distribution tools  
build = "^0.10.0"
twine = "^4.0.0"

[tool.poetry.scripts]
dbranching = "dbranching.cli:main"
dbbranch = "dbranching.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --cov=dbranching --cov-report=term-missing --cov-report=html --cov-report=xml"
testpaths = ["tests"]
markers = [
    "asyncio: marks tests as asyncio tests",
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (slower, real dependencies)",
    "performance: marks tests as performance benchmarks",
    "mysql: marks tests requiring MySQL database",
    "postgresql: marks tests requiring PostgreSQL database", 
    "sqlite: marks tests requiring SQLite database",
    "slow: marks tests as slow running"
]

[tool.coverage.run]
source = ["src/dbranching"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]

[tool.coverage.html]
directory = "htmlcov"

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "E501", "W503"]
exclude = [".git", "__pycache__", "dist", "build", ".venv"]

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101", "B601"]  # Skip assert_used and shell_injection_process_call for tests

[tool.bandit.assert_used]
skips = ["*/tests/*"]